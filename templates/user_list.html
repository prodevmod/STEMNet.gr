{% extends "layout.html" %}
{% block title %}{{ title }} - STEMNet Greece{% endblock %}
{% block content %}
<div style="max-width: var(--max-width); margin: 0 auto;">
    <h2>{{ title }}</h2>
    <div style="margin-top: 1.5rem;">
        {% if users %}
            {% for u in users %}
                <div class="card" style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; margin-bottom: 10px;">
                    <div>
                        <a href="{{ url_for('profile', username=u['username']) }}" class="username" style="font-size: 1.1rem; text-decoration: none;">
                            @{{ u['username'] }}
                        </a>
                    </div>
                    <!-- Uses the global .btn-primary class -->
                    <a href="{{ url_for('profile', username=u['username']) }}" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.4rem 1rem;">
                        View Profile
                    </a>
                </div>
            {% endfor %}
        {% else %}
            <p style="color: #64748b; text-align: center; padding: 2rem;">No accounts found here yet.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
