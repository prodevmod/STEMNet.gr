{% extends "layout.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="card" style="padding: 3rem 1.5rem; text-align: center; margin-top: 1rem; display: flex; flex-direction: column; align-items: center;">
    
    <!-- Centered Logo -->
    <img src="{{ url_for('static', filename='logo.svg') }}" 
         alt="STEMNet Greece Logo" 
         style="height: 72px; width: auto; margin-bottom: 1.25rem;">

    <h1 style="font-size: 4.5rem; margin: 0 0 0.25rem 0; font-weight: 800; line-height: 1;">404</h1>
    <h2 style="margin-top: 0; margin-bottom: 0.75rem;">Page Not Found</h2>
    
    <p style="color: #64748b; margin-bottom: 1.75rem; max-width: 400px; margin-left: auto; margin-right: auto;">
        The page or post you are looking for does not exist, may have been moved, or has a broken link.
    </p>

    <div>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            ← Back to Home
        </a>
    </div>
</div>
{% endblock %}
