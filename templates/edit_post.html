{% extends "layout.html" %}
{% block title %}Edit Post - STEMNet Greece{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Edit Post</h2>
    <form action="{{ url_for('edit_post', post_id=post['id']) }}" method="POST" style="margin-top: 1.5rem;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Category Selection -->
        <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required onchange="toggleCategoryFields()" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius);">
                <option value="Robotics" {% if post['category'] == 'Robotics' %}selected{% endif %}>Robotics & Microcontrollers</option>
                <option value="3D Modeling" {% if post['category'] == '3D Modeling' %}selected{% endif %}>3D Modeling & CAD</option>
                <option value="Software" {% if post['category'] == 'Software' %}selected{% endif %}>Software & Web Engineering</option>
                <option value="Electronics" {% if post['category'] == 'Electronics' %}selected{% endif %}>Electronics & PCB Design</option>
                <option value="AI" {% if post['category'] == 'AI' %}selected{% endif %}>AI & Data Science</option>
                <option value="Events" {% if post['category'] == 'Events' %}selected{% endif %}>Events</option>
                <option value="Other" {% if post['category'] not in ['Robotics', '3D Modeling', 'Software', 'Electronics', 'AI', 'Events'] %}selected{% endif %}>Other</option>
            </select>
        </div>

        <!-- Event Specific Fields -->
        <div id="event-fields-container" style="display: none; background: #f8fafc; padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border-color); margin-bottom: 1rem;">
            <div class="form-group">
                <label for="event_type">Event Type *</label>
                <select id="event_type" name="event_type" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius);">
                    <option value="Competition" {% if post['event_type'] == 'Competition' %}selected{% endif %}>Robot Competition / Tournament</option>
                    <option value="Workshop" {% if post['event_type'] == 'Workshop' %}selected{% endif %}>Workshop / Hackathon</option>
                    <option value="Meetup" {% if post['event_type'] == 'Meetup' %}selected{% endif %}>Team Meetup / Showcase</option>
                    <option value="Webinar" {% if post['event_type'] == 'Webinar' %}selected{% endif %}>Webinar / Online Conference</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="event_time">Event Date & Time *</label>
                <input type="datetime-local" id="event_time" name="event_time" value="{{ post['event_time'] or '' }}" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius);">
            </div>

            <div class="form-group" style="margin-top: 0.75rem;">
                <label for="event_location">Location / Link *</label>
                <input type="text" id="event_location" name="event_location" value="{{ post['event_location'] or '' }}" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius);">
            </div>
        </div>

        <!-- GitHub Link Field -->
        <div class="form-group" id="github-field-container" style="display: block;">
            <label for="github_link">GitHub Repository (Optional)</label>
            <input type="url" id="github_link" name="github_link" value="{{ post['github_link'] or '' }}" placeholder="https://github.com/your-team/repo">
        </div>

        <!-- Content Area -->
        <div class="form-group" style="margin-top: 1rem;">
            <label for="content">Content *</label>
            <textarea id="content" name="content" rows="5" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); font-family: inherit; resize: vertical;">{{ post['content'] }}</textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Update Post</button>
            <a href="{{ url_for('post_detail', post_id=post['id']) }}" class="btn btn-outline" style="background: #e2e8f0; color: #1e293b; text-decoration: none; padding: 0.75rem 1rem; border-radius: var(--radius); font-weight: 600; text-align: center;">Cancel</a>
        </div>
    </form>
</div>

<script>
function toggleCategoryFields() {
    const categorySelect = document.getElementById('category');
    const eventContainer = document.getElementById('event-fields-container');
    const githubContainer = document.getElementById('github-field-container');
    
    if (categorySelect.value === 'Events') {
        eventContainer.style.display = 'block';
        githubContainer.style.display = 'none';
    } else {
        eventContainer.style.display = 'none';
        githubContainer.style.display = 'block';
    }
}

document.addEventListener('DOMContentLoaded', toggleCategoryFields);
</script>
{% endblock %}
