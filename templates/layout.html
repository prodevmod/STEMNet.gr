<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}STEMNet Greece{% endblock %}</title>
    <!-- Link to your stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="brand"><strong>STEMNet.gr</strong></a>
            
            <!-- Mobile Menu Toggle Button (Transparent, hidden on wide screens) -->
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                <img src="{{ url_for('static', filename='dropdown.svg') }}" width="28" height="28" alt="Menu">
            </button>

            <!-- Navigation Links -->
            <div class="nav-links" id="navLinks">
                {% if g.user %}

                        <a href="{{ url_for('index') }}"style="display: flex; align-items: center;" title="Feed">
                                <img src="{{ url_for('static', filename='feed.svg') }}" width="22" height="22" alt="Feed">
                        <a href="{{ url_for('events_feed') }}" style="display: flex; align-items: center;" title="Events">
                                <img src="{{ url_for('static',filename='events.svg' ) }}" width="22" height="22" alt="Events">
                        <a href="{{ url_for('notifications') }}" style="display: flex; align-items: center;" title="Notifications">
                                <img src="{{ url_for('static', filename='notification_on.svg' if has_unread_notifications else 'bell.svg') }}" width="22" height="22" alt="Notifications">
                        </a>
                                <a href="{{ url_for('profile') }}" style="display: flex; align-items: center;" title="Profile">
                                <img src="{{ url_for('static', filename='profile.svg') }}" width="22" height="22" alt="Profile">
                            </a>
                        <a href="{{ url_for('search') }}" title="Search" style="display: inline-flex; align-items: center; text-decoration: none; padding: 5px;">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #64748b;">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </a>
                        <a href="{{ url_for('create_post') }}" class="btn btn-primary">+ New Post</a>
                        <a href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Log In</a>
                    <a href="{{ url_for('register') }}" class="btn btn-primary">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>

</body>
</html>
