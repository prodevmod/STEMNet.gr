{% extends "layout.html" %}

{% block title %}Log In - STEMNet Greece{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 2rem auto;">
    <h2 style="margin-bottom: 0.5rem;">Log In to STEMNet</h2>
    <p style="color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem;">
        Enter your credentials to access your robotics profile and post updates.
    </p>

    <form action="{{ url_for('login') }}" method="POST">
        <!-- CSRF Security Token -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-group">
            <label for="username_or_email">Username or Email</label>
            <input type="text" id="username_or_email" name="username_or_email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
        </div>

        <div class="form-group checkbox-group">
            <label for="remember" class="checkbox-label">
                <input type="checkbox" id="remember" name="remember" value="1" class="custom-checkbox">
                <span>Remember me</span>
            </label>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
    </form>

    <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: #64748b;">
        Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--primary-hover); font-weight: 600;">Register here</a>
    </p>
</div>
<!-- Google reCAPTCHA v3 API -->
<script src="https://www.google.com/recaptcha/api.js?render=YOUR_SITE_KEY"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.querySelector("form");
        if (form) {
            form.addEventListener("submit", function(e) {
                e.preventDefault(); // Pause form submission momentarily
                grecaptcha.ready(function() {
                    grecaptcha.execute('YOUR_SITE_KEY', {action: 'submit'}).then(function(token) {
                        // Append the token as a hidden input field
                        let input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'g-recaptcha-response';
                        input.value = token;
                        form.appendChild(input);
                        form.submit(); // Resume normal form submission
                    });
                });
            });
        }
    });
</script>
{% endblock %}
