<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: var(--bg-color, #f8fafc); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 1rem; font-family: system-ui, -apple-system, sans-serif;">

    <div class="card" style="padding: 3rem 1.5rem; text-align: center; max-width: 480px; width: 100%; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;">
        
        <!-- Centered Logo -->
        <img src="{{ url_for('static', filename='logo.svg') }}" 
             alt="STEMNet Greece Logo" 
             style="height: 72px; width: auto; margin-bottom: 1.25rem;">

        <h1 style="font-size: 4.5rem; margin: 0 0 0.25rem 0; font-weight: 800; line-height: 1;">500</h1>
        <h2 style="margin-top: 0; margin-bottom: 0.75rem;">Server Error</h2>
        
        <p style="color: #64748b; margin-bottom: 1.75rem; max-width: 400px; margin-left: auto; margin-right: auto;">
            The server encountered an internal error while processing your request. Please try again later.
        </p>

        <div>
            <a href="/" class="btn btn-primary">
                ← Back to Home
            </a>
        </div>
    </div>

</body>
</html>
