<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error | STEMNet Greece</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        :root {
            --bg-color: #f4f4f0;
            --primary-accent: #CCFF00;
            --danger-color: #ff3333;
            --dark-color: #000000;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#000000 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            margin: 0;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--dark-color);
        }

        .error-card {
            background: var(--card-bg);
            border: 4px solid var(--dark-color);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 8px 8px 0px var(--dark-color);
            overflow: hidden;
            box-sizing: border-box;
        }

        .card-header {
            background: var(--dark-color);
            color: #ffffff;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .card-body {
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .badge-500 {
            display: inline-block;
            background: var(--danger-color);
            color: #ffffff;
            border: 3px solid var(--dark-color);
            font-family: monospace;
            font-size: 3.5rem;
            font-weight: 900;
            padding: 0.1rem 1.25rem;
            box-shadow: 4px 4px 0px var(--dark-color);
            margin-bottom: 1.25rem;
            transform: rotate(-2deg);
        }

        .error-title {
            font-size: 1.65rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .terminal-box {
            background: #111827;
            color: #38ef7d;
            font-family: 'Courier New', Courier, monospace;
            text-align: left;
            padding: 0.85rem 1rem;
            border: 3px solid var(--dark-color);
            border-radius: 6px;
            font-size: 0.825rem;
            line-height: 1.5;
            margin: 1.25rem 0;
            box-shadow: 4px 4px 0px var(--dark-color);
        }

        .terminal-box .err-tag {
            color: var(--danger-color);
            font-weight: bold;
        }

        .action-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.75rem;
        }

        .neo-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.25rem;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            color: #000000;
            border: 3px solid var(--dark-color);
            border-radius: 6px;
            box-shadow: 4px 4px 0px var(--dark-color);
            transition: all 0.15s ease-in-out;
            cursor: pointer;
        }

        .neo-btn-primary {
            background-color: var(--primary-accent);
        }

        .neo-btn-secondary {
            background-color: #ffffff;
        }

        .neo-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--dark-color);
        }

        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--dark-color);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="card-header">
            <span>// STEMNET_DIAGNOSTICS</span>
            <span style="color: var(--primary-accent);">SYS_ERR_500</span>
        </div>
        
        <div class="card-body">
            <div class="badge-500">500</div>

            <h1 class="error-title">Internal Server Error</h1>

            <div class="terminal-box">
                <div><span class="err-tag">[STATUS]:</span> 500 EXCEPTION_THROWN</div>
                <div><span style="color: #9ca3af;">[MODULE]:</span> backend.process</div>
                <div><span style="color: #9ca3af;">[ACTION]:</span> Logged to app.log</div>
            </div>

            <p style="color: #4b5563; font-weight: 600; font-size: 0.9rem; line-height: 1.5; margin: 0;">
                An unexpected server exception occurred. The error has been logged automatically and is being looked into.
            </p>

            <div class="action-group">
                <a href="/" class="neo-btn neo-btn-primary">
                    ← Back to Feed
                </a>
                <button onclick="window.location.reload()" class="neo-btn neo-btn-secondary">
                    ↻ Reload Page
                </button>
            </div>
        </div>
    </div>

</body>
</html>
