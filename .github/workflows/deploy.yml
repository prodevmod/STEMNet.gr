name: Deploy STEMNet Frontend

on:
  push:
    branches: [ react_version, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH & Build on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/stemnet
            git pull origin react_version
            cd frontend-web
            npm ci
            echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" > .env
            npm run build
            cp -r dist/* /var/www/stemnet/
            nginx -t && systemctl reload nginx
            echo "Deployment complete!"
