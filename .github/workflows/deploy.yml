name: Deploy STEMNet Frontend

on:
  push:
    branches: [ react_version, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH & Build on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/stemnet
            git pull origin react_version
            
            # Navigate to your actual frontend directory (update path if needed)
            cd frontend-web
            
            # Install dependencies and build
            npm ci
            
            # Inject your reCAPTCHA or build environment variables if stored in a server .env file or GitHub secret
            # e.g., echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" > .env
            
            npm run build
            
            # Move files to Nginx web root
            cp -r dist/* /var/www/stemnet/
            
            # Test and reload Nginx
            nginx -t && systemctl reload nginx
            
            echo "Deployment complete!"
